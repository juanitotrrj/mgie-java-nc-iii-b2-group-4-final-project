components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque session token
      description: Use the token returned from POST /api/auth/login.
  responses:
    BadRequest:
      description: Invalid request or validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: Validation error
              value:
                success: false
                message: Validation failed.
                errors:
                - field: username
                  message: Username is required.
    Unauthorized:
      description: Authentication is required or the token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Missing or invalid token
              value:
                success: false
                message: Unauthorized.
                errors:
                - field: Authorization
                  message: Bearer token is missing or invalid.
    Forbidden:
      description: The authenticated user does not have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Forbidden
              value:
                success: false
                message: Forbidden.
                errors:
