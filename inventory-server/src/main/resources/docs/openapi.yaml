openapi: 3.0.3
info:
  title: Inventory Management System - Group 4 Backend API
  version: 1.0.0
  description: 'OpenAPI specification for the Inventory Management System backend API.


    The system is implemented as two programs:

    1. A Java Swing desktop client that holds the user interface.

    2. A Java SE 8 backend server that hosts REST-style API endpoints, handles authentication, authorization, validation,
    business rules, stock movement, file upload, reports, exports, settings, and database access.


    This contract is designed for Swagger API Explorer / Swagger UI testing.

    '
servers:
- url: http://localhost:8080
  description: Local Java SE 8 backend server
- url: http://localhost:8080/api
  description: Local API base path if mounted directly under /api
tags:
- name: System
  description: Server health and connectivity endpoints.
- name: Guest
  description: Public guest-mode endpoints.
- name: Authentication
  description: Login, logout, and current user session endpoints.
- name: Dashboard
  description: Role-specific dashboard summary endpoints.
- name: Products
  description: Product inventory master data endpoints.
- name: Categories
  description: Product category master data endpoints.
- name: Suppliers
  description: Supplier master data endpoints.
- name: Purchases
  description: Purchase order and receiving endpoints.
- name: Sales
  description: Sales invoice, payment, receipt, and cancellation endpoints.
- name: Inventory Change Requests
  description: Inventory clerk stock adjustment request and manager approval endpoints.
- name: Stock Movements
  description: Stock audit trail endpoints.
- name: Reports
  description: Report generation and export endpoints.
- name: Users
  description: Administrator user management endpoints.
- name: Settings
  description: Administrator system settings and database utility endpoints.
- name: Audit Logs
  description: Administrator audit log endpoints.
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      tags:
      - System
      summary: Test server connection
      description: Public endpoint used by Guest and Login pages to verify that the backend API and database are reachable.
      operationId: getHealth
      responses:
        '200':
          description: Server and database health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/public/welcome:
    get:
      tags:
      - Guest
      summary: Get guest welcome content
      description: Returns public welcome screen data for Guest mode.
      operationId: getPublicWelcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/public/about:
    get:
      tags:
      - Guest
      summary: Get about system content
      description: Returns public system overview, purpose, modules, benefits, and Guest limitations.
      operationId: getPublicAbout
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/public/contact:
    get:
      tags:
      - Guest
      summary: Get public contact information
      description: Returns support contact details shown on the Guest Contact Us page.
      operationId: getPublicContact
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/public/inquiries:
    post:
      tags:
      - Guest
      summary: Submit guest inquiry
      description: Allows a Guest to submit a support inquiry.
      operationId: createPublicInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
            examples:
              sample:
                summary: Guest inquiry
                value:
                  name: Juan Dela Cruz
                  email: juan@example.com
                  subject: System access request
                  message: Please help me request a user account.
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticates a user using username, password, and selected role. Returns a bearer token and role permissions.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              administrator:
                summary: Administrator login
                value:
                  username: admin
                  password: Admin@123
                  role: Administrator
              cashier:
                summary: Cashier login
                value:
                  username: jlim
                  password: Cashier@123
                  role: Cashier
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Invalidates the current bearer token/session.
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current authenticated user
      description: Returns the logged-in user's profile and permissions for menu/page access.
      operationId: getCurrentUser
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dashboard/admin:
    get:
      tags:
      - Dashboard
      summary: Get admin dashboard
      description: Administrator dashboard summary including system-wide metrics and recent activity.
      operationId: getAdminDashboard
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dashboard/manager:
    get:
      tags:
      - Dashboard
      summary: Get manager dashboard
      description: Manager dashboard summary including approvals, transactions, and top-selling items.
      operationId: getManagerDashboard
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dashboard/clerk:
    get:
      tags:
      - Dashboard
      summary: Get clerk dashboard
      description: Inventory Clerk dashboard summary including request status and inventory activity.
      operationId: getClerkDashboard
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClerkDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dashboard/cashier:
    get:
      tags:
      - Dashboard
      summary: Get cashier dashboard
      description: Cashier dashboard summary including today sales and recent sales.
      operationId: getCashierDashboard
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products:
    get:
      tags:
      - Products
      summary: List products
      description: Returns product records with search, filters, sorting, and pagination.
      operationId: listProducts
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number.
        example: 1
      - &id002
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: Page size.
        example: 10
      - &id003
        name: sortBy
        in: query
        required: false
        schema:
          type: string
        description: Column/property to sort by.
        example: createdAt
      - &id004
        name: sortDir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: Sort direction.
        example: asc
      - &id005
        name: search
        in: query
        required: false
        schema:
          type: string
        description: Keyword search.
        example: keyboard
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Filter by category.
        example: 1
      - &id006
        name: status
        in: query
        required: false
        schema:
          type: string
        description: Optional status filter.
        example: Active
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Products
      summary: Create product
      description: Creates a product record. Opening quantity creates an opening stock movement if greater than zero.
      operationId: createProduct
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            examples:
              keyboard:
                summary: Create keyboard product
                value:
                  productCode: P001
                  productName: Keyboard
                  categoryId: 1
                  supplierId: 1
                  quantity: 45
                  reorderLevel: 20
                  unitPrice: 850.0
                  status: In Stock
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products/{productId}:
    get:
      tags:
      - Products
      summary: View product details
      description: Returns full details of one product.
      operationId: getProductById
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Product identifier.
        example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Products
      summary: Update product
      description: Updates product fields. Direct stock quantity updates are restricted and should use inventory change requests
        when performed by Inventory Clerk.
      operationId: updateProduct
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Product identifier.
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            examples:
              update:
                summary: Update product details
                value:
                  productName: Mechanical Keyboard
                  categoryId: 1
                  supplierId: 1
                  reorderLevel: 20
                  unitPrice: 900.0
                  status: In Stock
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Products
      summary: Deactivate product
      description: Soft-deactivates a product while preserving transaction history.
      operationId: deleteProduct
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Product identifier.
        example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products/export:
    get:
      tags:
      - Products
      summary: Export products
      description: Exports filtered product records.
      operationId: exportProducts
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Filter by category.
        example: 1
      - *id006
      - &id007
        name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
          - pdf
          default: csv
        description: Export file format. CSV is required; XLSX/PDF are optional depending on included libraries.
        example: csv
      responses:
        '200':
          description: Products export file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products/{productId}/stock-movements:
    get:
      tags:
      - Stock Movements
      summary: List stock movements for product
      description: Returns stock movement history for a selected product.
      operationId: listProductStockMovements
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Product identifier.
        example: 1
      - *id001
      - *id002
      - *id003
      - *id004
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories:
    get:
      tags:
      - Categories
      summary: List categories
      description: Returns category records with product counts.
      operationId: listCategories
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Category type filter.
        example: Product Group
      - *id006
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Categories
      summary: Create category
      description: Creates a product category.
      operationId: createCategory
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              accessories:
                summary: Create category
                value:
                  categoryName: Accessories
                  description: Computer and device accessories
                  type: Product Group
                  status: Active
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories/{categoryId}:
    get:
      tags:
      - Categories
      summary: View category details
      description: Returns one category and product count.
      operationId: getCategoryById
      security:
      - bearerAuth: []
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Category identifier.
        example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Categories
      summary: Update category
      description: Updates category data.
      operationId: updateCategory
      security:
      - bearerAuth: []
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Category identifier.
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Categories
      summary: Deactivate category
      description: Soft-deactivates a category. Categories with linked products should not be hard-deleted.
      operationId: deleteCategory
      security:
      - bearerAuth: []
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Category identifier.
        example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/categories/export:
    get:
      tags:
      - Categories
      summary: Export categories
      description: Exports filtered category records.
      operationId: exportCategories
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Category type filter.
        example: Product Group
      - *id006
      - *id007
      responses:
        '200':
          description: Categories export file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/suppliers:
    get:
      tags:
      - Suppliers
      summary: List suppliers
      description: Returns supplier records with search, filters, sorting, and pagination.
      operationId: listSuppliers
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Supplier type filter.
        example: Local
      - *id006
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Suppliers
      summary: Create supplier
      description: Creates a supplier record.
      operationId: createSupplier
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
            examples:
              supplier:
                summary: Create supplier
                value:
                  supplierName: Tech Solutions Inc.
                  contactPerson: Robert Garcia
                  phone: (02) 8123-1111
                  email: robert.garcia@techsolutions.com
                  address: Makati City, Metro Manila
                  type: Local
                  preferred: true
                  status: Active
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/suppliers/{supplierId}:
    get:
      tags:
      - Suppliers
      summary: View supplier details
      description: Returns one supplier including purchase count.
      operationId: getSupplierById
      security:
      - bearerAuth: []
      parameters:
      - name: supplierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Supplier identifier.
        example: 1
      responses:
