      description: Inventory Clerk submits a stock adjustment/correction request. Product stock is not changed until Manager
        approval. Supports optional proof image upload.
      operationId: createInventoryChangeRequest
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - productId
              - requestType
              - reason
              properties:
                productId:
                  type: integer
                  format: int64
                  example: 4
                requestType:
                  type: string
                  enum:
                  - Adjustment
                  - Correction
                  - Damage
                  - Lost Item
                  - Found Item
                  example: Adjustment
                requestedQuantity:
                  type: integer
                  nullable: true
                  example: 4
                quantityChange:
                  type: integer
                  nullable: true
                  example: -1
                reason:
                  type: string
                  example: Overcounted during cycle count.
                proofImage:
                  type: string
                  format: binary
                  description: Optional image of counted inventory as proof.
      responses:
        '201':
          description: Created successfully
          content:
